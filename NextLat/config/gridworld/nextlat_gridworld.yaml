# Experiment 0 — NextLat arm. IDENTICAL to gpt_gridworld.yaml except the
# auxiliary next-latent loss (use_nextlat + the lambda_*/horizon/proj_factor
# block). Loss weights match the paper's Manhattan NextLat setting.
use_bst: false
use_nextlat: true
use_mtp_gloeckle: false
use_mtp_jtp: false

trainer:
  epochs: -1
  train_batches: 20000
  val_batches: 50
  test_batches: -1
  val_only: false
  val_printsamples: false
  log_interval: 50
  val_interval: 2000
  test_interval: 2000
  out_dir: output/gridworld
  init_from: scratch
  compile: false
  log_to_file: true
  log_to_wandb: false
  wandb_project: gridworld
  save_last_checkpoint: true
  save_best_checkpoint: true
  always_save_checkpoint: false
  save_recovery_checkpoint: -1
  experiment_name: NextLat

data:
  dataset: gridworld
  effective_batch_size: 256
  gradient_accum_steps: 1
  num_workers: 1
  test_generalization: false
  grid_size: 9
  trap_frac: 0.04
  map_seed: 7
  min_steps: 32
  max_steps: 72
  exp_k: 3
  window_d: 8
  n_train: 300000
  n_val: 10000

model:
  n_layer: 8
  n_head: 8
  n_embd: 256
  dropout: 0.0
  bias: false
  vocab_size: 0
  block_size: 256
  context_length: 0
  gpt_mode: next_token
  compute_hidden_state_rank: true
  # NextLat auxiliary loss (paper Manhattan setting)
  lambda_kl: 0.1
  lambda_mse: 1.0
  lambda_ce: 0.0
  mtp_horizon: 8
  proj_factor: 2.0

optimizer:
  optimizer_type: adam
  learning_rate: 3e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

lr_scheduler:
  schedule: constant
  warmup_iters: 200
  warmdown_iters: 0

seed: 1234
