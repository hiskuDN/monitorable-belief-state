# Storyworld (belief tracking in language) — GPT baseline arm (matched to nextlat_concealworld.yaml).
# Merged on top of defaults.yaml. Only the auxiliary loss differs between the arms.
# Backbone/optimizer/training identical to the Exp-0 gridworld arms.
use_bst: false
use_nextlat: false
use_mtp_gloeckle: false
use_mtp_jtp: false

trainer:
  epochs: -1
  train_batches: 20000
  val_batches: 50
  test_batches: -1
  val_only: false
  val_printsamples: false
  log_interval: 50
  val_interval: 2000
  test_interval: 2000        # concealworld has no per-dataset eval branch; harmless
  out_dir: output/storyworld
  init_from: scratch
  compile: false             # fast startup; enable on GPU for the long runs
  log_to_file: true
  log_to_wandb: false
  wandb_project: storyworld
  save_last_checkpoint: true
  save_best_checkpoint: true
  always_save_checkpoint: false
  save_recovery_checkpoint: -1
  experiment_name: GPT

data:
  dataset: storyworld
  effective_batch_size: 256
  gradient_accum_steps: 1
  num_workers: 1
  test_generalization: false
  # concealworld env params (consumed by data/concealworld.py:params_from_config)
  n_states: 6              # K shelves (modulus / belief states) — headroom knob
  n_distractors: 2         # distractor objects (language noise / binding) — headroom knob
  n_move: 16               # # move sentences (FIXED length) — headroom knob
  max_delta: 2             # max relative move magnitude
  target_density: 0.5      # fraction of moves about the target object
  coref_prob: 0.5          # P(use 'it' when same object as previous move)
  n_agents: 3
  n_train: 300000
  n_val: 10000

model:
  n_layer: 8
  n_head: 8
  n_embd: 256
  dropout: 0.0
  bias: false
  vocab_size: 0             # overwritten by datamodule.update_config
  block_size: 256
  context_length: 0
  gpt_mode: next_token
  compute_hidden_state_rank: true

optimizer:
  optimizer_type: adam
  learning_rate: 3e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

lr_scheduler:
  schedule: constant
  warmup_iters: 200
  warmdown_iters: 0

seed: 1234
