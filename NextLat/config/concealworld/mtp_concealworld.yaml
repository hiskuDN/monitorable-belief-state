# Concealworld (2a) — MTP (Gloeckle multi-token prediction) arm. Same backbone as the
# GPT/NextLat arms; the only difference is the multi-token auxiliary loss. Keeps the
# claim class-level (does the effect hold for a non-NextLat predict-ahead objective?).
use_bst: false
use_nextlat: false
use_mtp_gloeckle: true
use_mtp_jtp: false

trainer:
  epochs: -1
  train_batches: 6000
  val_batches: 50
  test_batches: -1
  val_only: false
  val_printsamples: false
  log_interval: 50
  val_interval: 2000
  test_interval: 2000
  out_dir: output/concealworld
  init_from: scratch
  compile: false
  log_to_file: true
  log_to_wandb: false
  wandb_project: concealworld
  save_last_checkpoint: true
  save_best_checkpoint: true
  always_save_checkpoint: false
  save_recovery_checkpoint: -1
  experiment_name: MTP

data:
  dataset: concealworld
  effective_batch_size: 256
  gradient_accum_steps: 1
  num_workers: 1
  test_generalization: false
  # concealworld env params (consumed by data/concealworld.py:params_from_config)
  n_states: 8
  wander_len: 48
  update_density: 0.5
  n_train: 300000
  n_val: 10000

model:
  n_layer: 8
  n_head: 8
  n_embd: 256
  dropout: 0.0
  bias: false
  vocab_size: 0
  block_size: 256
  context_length: 0
  gpt_mode: next_token
  compute_hidden_state_rank: true
  mtp_horizon: 8
  mtp_lambda: 1.0

optimizer:
  optimizer_type: adam
  learning_rate: 3e-4
  weight_decay: 0.01
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

lr_scheduler:
  schedule: constant
  warmup_iters: 200
  warmdown_iters: 0

seed: 1234
