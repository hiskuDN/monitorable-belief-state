<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 352" width="820" height="352" fill="none" role="img" aria-labelledby="bm-title">
  <title id="bm-title">A linear probe decoding two models' internal belief about their position on a grid. The vanilla model's readout is a diffuse smear that peaks on the wrong cell; the predict-ahead model's readout is a single sharp cell on the true position.</title>
  <defs>
    <radialGradient id="nlGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4fd1c5" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#4fd1c5" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: reduce) { animate { display: none; } }
    text { font-family: SFMono-Regular, ui-monospace, "SF Mono", Menlo, monospace; }
  </style>

  <rect x="2" y="2" width="816" height="348" rx="16" fill="#0d1117" stroke="#1c2333"/>

  <text x="410" y="40" text-anchor="middle" font-size="11" letter-spacing="2.5" fill="#7c9cff" font-weight="700">THE BELIEF-STATE MONITOR</text>
  <text x="410" y="62" text-anchor="middle" font-size="12" fill="#97a0b8">same task, same probe, only the training objective differs</text>

  <text x="210" y="112" text-anchor="middle" font-size="13" font-weight="700" fill="#f2754f">GPT (vanilla)</text>
  <text x="590" y="112" text-anchor="middle" font-size="12" font-weight="700" fill="#4fd1c5">predict-ahead (NextLat, MTP, JTP)</text>
  <text x="210" y="130" text-anchor="middle" font-size="10" fill="#6b748c">linear probe &#8595;</text>
  <text x="590" y="130" text-anchor="middle" font-size="10" fill="#6b748c">linear probe &#8595;</text>

  <g><rect x="150" y="150" width="120" height="120" rx="4" fill="#0a0d14" stroke="#28304a"/><g stroke="#172033" stroke-width="0.8"><line x1="170" y1="150" x2="170" y2="270"/><line x1="150" y1="170" x2="270" y2="170"/><line x1="190" y1="150" x2="190" y2="270"/><line x1="150" y1="190" x2="270" y2="190"/><line x1="210" y1="150" x2="210" y2="270"/><line x1="150" y1="210" x2="270" y2="210"/><line x1="230" y1="150" x2="230" y2="270"/><line x1="150" y1="230" x2="270" y2="230"/><line x1="250" y1="150" x2="250" y2="270"/><line x1="150" y1="250" x2="270" y2="250"/></g><rect x="171" y="231" width="18" height="18" rx="2.5" fill="0.8" opacity="True"></rect><rect x="151" y="231" width="18" height="18" rx="2.5" fill="0.4" opacity="False"></rect><rect x="191" y="231" width="18" height="18" rx="2.5" fill="0.46" opacity="False"></rect><rect x="171" y="211" width="18" height="18" rx="2.5" fill="0.44" opacity="True"></rect><rect x="171" y="251" width="18" height="18" rx="2.5" fill="0.4" opacity="False"></rect><rect x="151" y="211" width="18" height="18" rx="2.5" fill="0.26" opacity="False"></rect><rect x="191" y="211" width="18" height="18" rx="2.5" fill="0.3" opacity="False"></rect><rect x="151" y="251" width="18" height="18" rx="2.5" fill="0.26" opacity="False"></rect><rect x="191" y="251" width="18" height="18" rx="2.5" fill="0.24" opacity="True"></rect><rect x="171" y="191" width="18" height="18" rx="2.5" fill="0.22" opacity="False"></rect><rect x="211" y="231" width="18" height="18" rx="2.5" fill="0.18" opacity="False"></rect><rect x="151" y="191" width="18" height="18" rx="2.5" fill="0.16" opacity="False"></rect><rect x="191" y="191" width="18" height="18" rx="2.5" fill="0.14" opacity="False"></rect><rect x="231" y="171" width="18" height="18" rx="2.5" fill="0.1" opacity="False"></rect><rect x="231" y="211" width="18" height="18" rx="2.5" fill="0.12" opacity="False"></rect><rect x="211" y="191" width="18" height="18" rx="2.5" fill="0.12" opacity="False"></rect><rect x="251" y="231" width="18" height="18" rx="2.5" fill="0.1" opacity="False"></rect><rect x="211" y="251" width="18" height="18" rx="2.5" fill="0.1" opacity="True"></rect><rect x="231" y="231" width="18" height="18" rx="2.5" fill="0.1" opacity="False"></rect><rect x="251" y="211" width="18" height="18" rx="2.5" fill="0.08" opacity="False"></rect><rect x="211" y="171" width="18" height="18" rx="2.5" fill="0.08" opacity="False"></rect><circle cx="160.0" cy="160.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="260.0" cy="260.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="260.0" cy="160.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="160.0" cy="260.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="200.0" cy="160.0" r="1.6" fill="#ffffff" opacity="0.45"/><rect x="230.5" y="170.5" width="19" height="19" rx="3" fill="none" stroke="#ffd166" stroke-width="1.8"/><rect x="150" y="150" width="120" height="2" fill="#7c9cff" opacity="0.35"><animate attributeName="y" values="150;268;150" dur="3.2s" repeatCount="indefinite"/></rect></g>
  <text x="210" y="292" text-anchor="middle" font-size="11" fill="#f2754f">confident, but on the wrong cell</text>

  <g><rect x="530" y="150" width="120" height="120" rx="4" fill="#0a0d14" stroke="#28304a"/><g stroke="#172033" stroke-width="0.8"><line x1="550" y1="150" x2="550" y2="270"/><line x1="530" y1="170" x2="650" y2="170"/><line x1="570" y1="150" x2="570" y2="270"/><line x1="530" y1="190" x2="650" y2="190"/><line x1="590" y1="150" x2="590" y2="270"/><line x1="530" y1="210" x2="650" y2="210"/><line x1="610" y1="150" x2="610" y2="270"/><line x1="530" y1="230" x2="650" y2="230"/><line x1="630" y1="150" x2="630" y2="270"/><line x1="530" y1="250" x2="650" y2="250"/></g><circle cx="620.0" cy="180.0" r="18" fill="url(#nlGlow)"><animate attributeName="r" values="15;24;15" dur="2.6s" repeatCount="indefinite"/></circle><rect x="611" y="171" width="18" height="18" rx="2.5" fill="0.96" opacity="True"></rect><rect x="611" y="151" width="18" height="18" rx="2.5" fill="0.07" opacity="False"></rect><rect x="611" y="191" width="18" height="18" rx="2.5" fill="0.07" opacity="False"></rect><rect x="591" y="171" width="18" height="18" rx="2.5" fill="0.06" opacity="False"></rect><rect x="631" y="171" width="18" height="18" rx="2.5" fill="0.06" opacity="False"></rect><circle cx="540.0" cy="160.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="640.0" cy="260.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="640.0" cy="160.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="540.0" cy="260.0" r="1.6" fill="#ffffff" opacity="0.45"/><circle cx="580.0" cy="160.0" r="1.6" fill="#ffffff" opacity="0.45"/><rect x="610.5" y="170.5" width="19" height="19" rx="3" fill="none" stroke="#ffd166" stroke-width="1.8"/><rect x="530" y="150" width="120" height="2" fill="#7c9cff" opacity="0.35"><animate attributeName="y" values="150;268;150" dur="3.2s" repeatCount="indefinite"/></rect></g>
  <text x="590" y="292" text-anchor="middle" font-size="11" fill="#4fd1c5">confident, on the true cell</text>

  <text x="410" y="324" text-anchor="middle" font-size="13" fill="#c7cde0">the predictive objective makes the same belief <tspan fill="#fff" font-weight="700">linearly legible</tspan></text>
</svg>
