<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 430" width="880" height="430" fill="none" role="img" aria-labelledby="sw-title">
  <title id="sw-title">A linear probe reading the tracked object's current shelf off two models at the same mid-story token. NextLat-1step reads the true shelf sharply (green, gold-outlined); the vanilla GPT model is confidently on the wrong shelf (red).</title>
  <style>text { font-family: SFMono-Regular, ui-monospace, "SF Mono", Menlo, monospace; }</style>
  <rect x="2" y="2" width="876" height="426" rx="16" fill="#0d1117" stroke="#1c2333"/>

  <text x="440" y="42" text-anchor="middle" font-size="11" letter-spacing="2.2" fill="#7c9cff" font-weight="700">READING THE BELIEF WHILE THE MODEL READS A STORY</text>
  <text x="440" y="64" text-anchor="middle" font-size="12" fill="#97a0b8">same story, same probe, only the training objective differs</text>

  <!-- narrative strip with the playhead -->
  <rect x="30" y="78" width="820" height="34" rx="9" fill="#0a0d14" stroke="#222b42"/>
  <text x="40" y="100" font-size="13"><tspan fill="#5b6480">... </tspan><tspan fill="#aeb6cc" font-weight="400">shelves</tspan><tspan> </tspan><tspan fill="#aeb6cc" font-weight="400">.</tspan><tspan> </tspan><tspan fill="#aeb6cc" font-weight="400">bob</tspan><tspan> </tspan><tspan fill="#aeb6cc" font-weight="400">moves</tspan><tspan> </tspan><tspan fill="#aeb6cc" font-weight="400">ball</tspan><tspan> </tspan><tspan fill="#aeb6cc" font-weight="400">down</tspan><tspan> </tspan><tspan fill="#aeb6cc" font-weight="400">one</tspan><tspan> </tspan><tspan fill="#ffd166" font-weight="700">shelves</tspan><tspan> </tspan><tspan fill="#aeb6cc" font-weight="400">.</tspan><tspan> </tspan><tspan fill="#5b6480">...</tspan></text>

  <text x="240" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#f2754f">GPT (vanilla)</text>
  <text x="640" y="188" text-anchor="middle" font-size="13" font-weight="700" fill="#4fd1c5">NextLat (1 step ahead)</text>
  <text x="240" y="205" text-anchor="middle" font-size="10" fill="#6b748c">probe &#8595; which shelf is the ball on?</text>
  <text x="640" y="205" text-anchor="middle" font-size="10" fill="#6b748c">probe &#8595; which shelf is the ball on?</text>

  <rect x="134.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#2b3350" stroke-width="1"/><rect x="134.5" y="296.323" width="46" height="7.7" rx="6" fill="#2b3350" opacity="0.27"/><text x="158" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">0</text><text x="176" y="298" text-anchor="end" font-size="10" fill="#8b93ad">9</text><rect x="189.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#2b3350" stroke-width="1"/><rect x="189.5" y="242.593" width="46" height="61.4" rx="6" fill="#f2754f" opacity="0.63"/><rect x="187.5" y="212" width="50" height="94" rx="8" fill="none" stroke="#f2754f" stroke-width="2.2"/><text x="212" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">1</text><text x="230" y="298" text-anchor="end" font-size="10" fill="#8b93ad">68</text><rect x="244.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#2b3350" stroke-width="1"/><rect x="244.5" y="292.849" width="46" height="11.2" rx="6" fill="#2b3350" opacity="0.29"/><text x="268" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">2</text><text x="286" y="298" text-anchor="end" font-size="10" fill="#8b93ad">12</text><rect x="299.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#ffd166" stroke-width="2"/><rect x="299.5" y="294.235" width="46" height="9.8" rx="6" fill="#4fd1c5" opacity="0.29"/><text x="322" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">3</text><text x="340" y="298" text-anchor="end" font-size="10" fill="#8b93ad">11</text>
  <rect x="534.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#2b3350" stroke-width="1"/><rect x="534.5" y="300" width="46" height="4.0" rx="6" fill="#2b3350" opacity="0.22"/><text x="558" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">0</text><text x="576" y="298" text-anchor="end" font-size="10" fill="#8b93ad">0</text><rect x="589.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#2b3350" stroke-width="1"/><rect x="589.5" y="300" width="46" height="4.0" rx="6" fill="#2b3350" opacity="0.22"/><text x="612" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">1</text><text x="630" y="298" text-anchor="end" font-size="10" fill="#8b93ad">0</text><rect x="644.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#2b3350" stroke-width="1"/><rect x="644.5" y="300" width="46" height="4.0" rx="6" fill="#2b3350" opacity="0.22"/><text x="668" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">2</text><text x="686" y="298" text-anchor="end" font-size="10" fill="#8b93ad">0</text><rect x="699.5" y="214" width="46" height="90" rx="7" fill="#0a0d14" stroke="#ffd166" stroke-width="2"/><rect x="699.5" y="214.0" width="46" height="90.0" rx="6" fill="#4fd1c5" opacity="0.82"/><rect x="697.5" y="212" width="50" height="94" rx="8" fill="none" stroke="#4fd1c5" stroke-width="2.2"/><text x="722" y="265" text-anchor="middle" font-size="18" font-weight="700" fill="#e7ecff">3</text><text x="740" y="298" text-anchor="end" font-size="10" fill="#8b93ad">100</text>

  <text x="240" y="340" text-anchor="middle" font-size="12" fill="#f2754f" font-weight="700">reads shelf 1: confidently wrong</text>
  <text x="640" y="340" text-anchor="middle" font-size="12" fill="#4fd1c5" font-weight="700">reads shelf 3: the true shelf</text>
  <text x="240" y="360" text-anchor="middle" font-size="10.5" fill="#7c8398">true shelf is <tspan fill="#ffd166">3</tspan> (outlined)</text>
  <text x="640" y="360" text-anchor="middle" font-size="10.5" fill="#7c8398">true shelf is <tspan fill="#ffd166">3</tspan> (outlined)</text>

  <text x="440" y="410" text-anchor="middle" font-size="13" fill="#c7cde0">the predictive objective keeps the tracked belief <tspan fill="#fff" font-weight="700">linearly legible</tspan> mid-story</text>
</svg>
